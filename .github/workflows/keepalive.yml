# Бесплатный проект Supabase «засыпает» после недели без запросов.
# Этот сценарий раз в 3 дня делает пустой запрос, чтобы база всегда была доступна.
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          URL=$(sed -n "s/.*SUPABASE_URL: *'\([^']*\)'.*/\1/p" docs/config.js)
          KEY=$(sed -n "s/.*SUPABASE_ANON_KEY: *'\([^']*\)'.*/\1/p" docs/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js не заполнен"; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
